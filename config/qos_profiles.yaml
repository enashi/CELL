# Example QoS Profile Configuration
# Students will need to adapt this to OAI SMF configuration format

qos_profiles:
  # Conversational Voice
  - profile_name: "VoIP"
    5qi: 1
    resource_type: "GBR"
    priority_level: 20
    packet_delay_budget: 100  # ms
    packet_error_rate: 1e-2
    guaranteed_flow_bit_rate_dl: 150  # kbps
    guaranteed_flow_bit_rate_ul: 150  # kbps
    maximum_flow_bit_rate_dl: 150
    maximum_flow_bit_rate_ul: 150
    
  # IMS Signaling
  - profile_name: "IMS_Signaling"
    5qi: 5
    resource_type: "Non-GBR"
    priority_level: 10
    packet_delay_budget: 100  # ms
    packet_error_rate: 1e-6
    
  # Video Streaming
  - profile_name: "Video"
    5qi: 9
    resource_type: "Non-GBR"
    priority_level: 80
    packet_delay_budget: 300  # ms
    packet_error_rate: 1e-6
    
  # Low Latency eMBB
  - profile_name: "Low_Latency_Data"
    5qi: 79
    resource_type: "Non-GBR"
    priority_level: 65
    packet_delay_budget: 50  # ms
    packet_error_rate: 1e-6
    
  # Best Effort
  - profile_name: "Best_Effort"
    5qi: 9
    resource_type: "Non-GBR"
    priority_level: 90
    packet_delay_budget: 300  # ms
    packet_error_rate: 1e-6

